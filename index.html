<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fogo & Água</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="gameContainer">

        <h1>🔥 Fogo & Água 💧</h1>

        <p id="info">
            Trabalhem juntos para pegar as gemas e chegar às portas!
        </p>

        <canvas id="game" width="960" height="540"></canvas>

        <div id="controls">
            <span class="fireText">
                🔥 Fogo: W A S D
            </span>

            <span>
                R = Reiniciar
            </span>

            <span class="waterText">
                💧 Água: ↑ ← ↓ →
            </span>
        </div>

        <button id="restartButton">
            Reiniciar
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
